<style>
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: #24292e;
    background: #ffffff;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  h1, h2, h3, h4, h5, h6 {
    font-weight: 600;
    margin-top: 1.6em;
    margin-bottom: 0.6em;
  }
  h1 { font-size: 2em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
  h2 { font-size: 1.5em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; margin-top: 2em; }
  h3 { font-size: 1.25em; }
  h4 { font-size: 1.05em; }
  p, ul, ol { margin-top: 0; margin-bottom: 1em; }
  a { color: #0969da; text-decoration: none; }
  a:hover { text-decoration: underline; }
  code {
    font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    background: rgba(175,184,193,0.2);
    padding: 0.2em 0.4em;
    border-radius: 4px;
    font-size: 0.9em;
  }
  pre {
    background: #f6f8fa;
    border-radius: 6px;
    padding: 14px;
    overflow-x: auto;
    line-height: 1.45;
  }
  pre code { background: transparent; padding: 0; font-size: 0.88em; }
  blockquote {
    border-left: 4px solid #d0d7de;
    color: #57606a;
    padding: 0 1em;
    margin-left: 0;
  }
  table {
    border-collapse: collapse;
    margin-bottom: 1em;
    width: auto;
  }
  th, td {
    border: 1px solid #d0d7de;
    padding: 6px 13px;
  }
  th { background: #f6f8fa; font-weight: 600; }
  tr:nth-child(2n) { background: #f6f8fa; }
  hr { border: 0; border-top: 1px solid #eaecef; margin: 2em 0; }
  img { max-width: 100%; }

  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #c9d1d9; }
    h1, h2 { border-bottom-color: #21262d; }
    a { color: #58a6ff; }
    code { background: rgba(110,118,129,0.4); }
    pre { background: #161b22; }
    blockquote { border-left-color: #30363d; color: #8b949e; }
    th, td { border-color: #30363d; }
    th, tr:nth-child(2n) { background: #161b22; }
    hr { border-top-color: #21262d; }
  }
</style>
